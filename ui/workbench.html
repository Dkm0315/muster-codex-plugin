<div id="muster-root" aria-live="polite"></div>
<style>
  :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: transparent; color: light-dark(#171717, #ececec); }
  button { font: inherit; color: inherit; }
  #muster-root { min-height: 180px; width: 100%; }
  .muster-shell { width: 100%; overflow: hidden; border: 1px solid light-dark(#dedede, #303030); border-radius: 12px; background: light-dark(#fff, #0b0b0b); }
  .muster-toolbar { display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 0 12px; border-bottom: 1px solid light-dark(#e5e5e5, #292929); }
  .muster-toolbar strong { font-weight: 600; }
  .muster-toolbar .spacer { flex: 1; }
  .muster-muted { color: light-dark(#6d6d6d, #888); }
  .muster-stat-add { color: light-dark(#287a3d, #63c174); }
  .muster-stat-del { color: light-dark(#b44747, #e46e6e); }
  .muster-button { border: 1px solid light-dark(#d2d2d2, #393939); border-radius: 7px; padding: 6px 9px; background: light-dark(#f7f7f7, #1b1b1b); cursor: pointer; }
  .muster-button:hover { background: light-dark(#eee, #262626); }
  .muster-segment { display: flex; gap: 2px; }
  .muster-segment button { border: 0; border-radius: 6px; padding: 5px 9px; background: transparent; color: light-dark(#666, #888); cursor: pointer; }
  .muster-segment button.active { background: light-dark(#e9e9e9, #292929); color: light-dark(#171717, #f2f2f2); }

  .file-layout { display: grid; grid-template-columns: minmax(0, 1fr) 220px; min-height: 460px; }
  .file-main { min-width: 0; display: grid; grid-template-rows: 1fr 30px; }
  .file-stage { min-height: 430px; max-height: 680px; display: flex; overflow: hidden; background: light-dark(#fbfbfb, #080808); }
  .file-pane { flex: 1 1 100%; min-width: 0; overflow: auto; }
  .file-pane + .file-pane { border-left: 1px solid light-dark(#ddd, #2d2d2d); }
  .pane-label { position: sticky; top: 0; z-index: 2; padding: 6px 10px; background: light-dark(#f1f1f1, #171717); color: light-dark(#555, #aaa); font-size: 12px; }
  .code-list { min-width: 660px; padding: 8px 0 26px; }
  .code-row { display: grid; grid-template-columns: 22px 48px 1fr; min-height: 21px; font: 12px/1.45 "SFMono-Regular", Menlo, Consolas, monospace; }
  .code-row .mark { text-align: center; color: light-dark(#777, #777); }
  .code-row .line { padding-right: 10px; text-align: right; color: light-dark(#8c8c8c, #5f5f5f); user-select: none; }
  .code-row code { white-space: pre; padding-right: 16px; color: light-dark(#252525, #cfcfcf); }
  .code-row.add { background: light-dark(#e2f4e6, #11291a); }
  .code-row.add code, .code-row.add .mark { color: light-dark(#245f32, #b9dfc0); }
  .code-row.del { background: light-dark(#f7e3e3, #34191b); }
  .code-row.del code, .code-row.del .mark { color: light-dark(#873b3b, #e3b8ba); }
  .file-status { display: flex; align-items: center; gap: 8px; padding: 0 10px; border-top: 1px solid light-dark(#e5e5e5, #272727); color: light-dark(#666, #777); font-size: 11px; }
  .tree { min-width: 0; overflow: auto; border-left: 1px solid light-dark(#e1e1e1, #292929); padding: 10px 7px; }
  .tree header { display: flex; justify-content: space-between; padding: 4px 7px 10px; color: light-dark(#555, #aaa); font-size: 12px; }
  .tree-row { width: 100%; overflow: hidden; padding: 5px 7px; border: 0; border-radius: 6px; background: transparent; text-align: left; text-overflow: ellipsis; white-space: nowrap; color: light-dark(#444, #aaa); font: 11px/1.4 "SFMono-Regular", Menlo, monospace; }
  .tree-row.active { background: light-dark(#e9eef8, #202838); color: light-dark(#1f4f9a, #9bbcff); }

  .board-toolbar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid light-dark(#e4e4e4, #292929); }
  .board-toolbar .spacer { flex: 1; }
  .board-grid { display: grid; grid-template-columns: repeat(5, minmax(160px, 1fr)); min-height: 500px; overflow: auto; background: light-dark(#ddd, #292929); gap: 1px; }
  .lane { min-width: 160px; padding: 10px; background: light-dark(#fafafa, #0b0b0b); }
  .lane header { display: flex; justify-content: space-between; padding: 0 2px 10px; color: light-dark(#555, #aaa); font-size: 12px; font-weight: 600; }
  .lane header span { font-weight: 400; color: light-dark(#888, #666); }
  .task { display: grid; gap: 6px; width: 100%; margin-bottom: 8px; padding: 10px; border: 1px solid light-dark(#d8d8d8, #2b2b2b); border-radius: 8px; background: light-dark(#fff, #151515); text-align: left; }
  .task.selected { border-color: light-dark(#6185c4, #5977b7); background: light-dark(#f1f5fc, #182034); }
  .task .id { color: light-dark(#4771b5, #7898db); font-size: 10px; }
  .task strong { font-size: 12px; line-height: 1.35; font-weight: 600; }
  .task small { color: light-dark(#6f6f6f, #858585); line-height: 1.35; }
  .task .model { color: light-dark(#6548a0, #a58be0); font-size: 10px; }
  .verified { color: light-dark(#287a3d, #63c174) !important; }
  .blocked { color: light-dark(#9b651d, #d4a85f) !important; }
  .empty { padding: 18px 4px; color: light-dark(#999, #555); font-size: 11px; text-align: center; }
  .board-footer { padding: 9px 12px; border-top: 1px solid light-dark(#e3e3e3, #292929); color: light-dark(#666, #777); font-size: 11px; }
  .error { padding: 18px; color: light-dark(#9c2828, #ff8b8b); }
  @media (max-width: 850px) {
    .file-layout { grid-template-columns: 1fr; }
    .tree { display: none; }
    .board-grid { grid-template-columns: repeat(5, 180px); }
    .muster-toolbar { flex-wrap: wrap; padding-block: 8px; }
  }
</style>
<script>
  (() => {
    const root = document.getElementById("muster-root");
    let data = null;
    let fileMode = "working";
    let nextRequestId = 1;
    const pending = new Map();

    const escapeHtml = (value) => String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");

    function request(method, params) {
      const id = nextRequestId++;
      window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
      return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
    }

    function parsePatch(patch) {
      const added = new Set();
      const deletedAt = new Map();
      let oldLine = 0;
      let newLine = 0;
      for (const line of String(patch || "").split("\n")) {
        const hunk = line.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
        if (hunk) {
          oldLine = Number(hunk[1]);
          newLine = Number(hunk[2]);
          continue;
        }
        if (line.startsWith("+++") || line.startsWith("---")) continue;
        if (line.startsWith("+")) {
          added.add(newLine);
          newLine += 1;
        } else if (line.startsWith("-")) {
          const rows = deletedAt.get(newLine) || [];
          rows.push({ oldLine, text: line.slice(1) });
          deletedAt.set(newLine, rows);
          oldLine += 1;
        } else if (line.startsWith(" ")) {
          oldLine += 1;
          newLine += 1;
        }
      }
      return { added, deletedAt };
    }

    function codeRows(content, side, patch) {
      const lines = String(content || "").split("\n");
      const changes = parsePatch(patch);
      let html = "";
      lines.forEach((line, index) => {
        const number = index + 1;
        if (side === "working") {
          for (const deleted of changes.deletedAt.get(number) || []) {
            html += `<div class="code-row del"><span class="mark">−</span><span class="line">${deleted.oldLine}</span><code>${escapeHtml(deleted.text)}</code></div>`;
          }
        }
        const tone = side === "working" && changes.added.has(number) ? " add" : "";
        html += `<div class="code-row${tone}"><span class="mark">${tone ? "+" : ""}</span><span class="line">${number}</span><code>${escapeHtml(line || " ")}</code></div>`;
      });
      return html;
    }

    function filePane(content, side, patch, label) {
      return `<div class="file-pane">${label ? `<div class="pane-label">${label}</div>` : ""}<div class="code-list">${codeRows(content, side, patch)}</div></div>`;
    }

    function renderFile(value) {
      const stats = value.stats || { added: 0, deleted: 0 };
      const tree = (value.tree || []).map((path) => `<button class="tree-row ${path === value.path ? "active" : ""}" data-path="${escapeHtml(path)}">${escapeHtml(path)}</button>`).join("");
      const stage = fileMode === "split"
        ? filePane(value.before, "before", value.patch, "Before") + filePane(value.working, "working", value.patch, "Working")
        : filePane(fileMode === "before" ? value.before : value.working, fileMode, value.patch, "");
      root.innerHTML = `
        <section class="muster-shell">
          <header class="muster-toolbar">
            <strong>${escapeHtml(value.path)}</strong>
            <span class="muster-muted">Full file · ${value.lineCount} lines</span>
            <span class="muster-stat-add">+${stats.added}</span><span class="muster-stat-del">−${stats.deleted}</span>
            <span class="spacer"></span>
            <div class="muster-segment">
              ${["working", "before", "split"].map((mode) => `<button data-mode="${mode}" class="${fileMode === mode ? "active" : ""}">${mode[0].toUpperCase() + mode.slice(1)}</button>`).join("")}
            </div>
          </header>
          <div class="file-layout">
            <div class="file-main"><div class="file-stage">${stage}</div><div class="file-status">Complete file · unchanged context preserved · visibility only</div></div>
            <aside class="tree"><header><span>Codebase</span><span>${value.tree?.length || 0}</span></header>${tree}</aside>
          </div>
        </section>`;
      root.querySelectorAll("[data-mode]").forEach((button) => button.addEventListener("click", () => { fileMode = button.dataset.mode; renderFile(value); }));
      root.querySelectorAll("[data-path]").forEach((button) => button.addEventListener("click", async () => {
        const result = await request("tools/call", { name: "muster_render_full_file", arguments: { cwd: value.cwd, path: button.dataset.path } });
        if (result?.structuredContent) { data = result.structuredContent; render(data); }
      }));
      setTimeout(() => {
        root.querySelectorAll(".file-pane").forEach((pane) => {
          const changed = pane.querySelector(".add, .del");
          if (changed) pane.scrollTop = Math.max(0, changed.offsetTop - 180);
        });
      }, 0);
    }

    const laneLabels = { backlog: "Backlog", ready: "Ready", running: "Running", review: "Review", done: "Done" };
    function renderBoard(value) {
      const byLane = Object.fromEntries(Object.keys(laneLabels).map((lane) => [lane, (value.tasks || []).filter((task) => task.status === lane)]));
      const ready = byLane.ready.length;
      const columns = Object.entries(laneLabels).map(([lane, label]) => {
        const tasks = byLane[lane];
        return `<section class="lane"><header>${label}<span>${tasks.length}</span></header>${tasks.map((task) => {
          const latest = task.evidence?.at(-1);
          const meta = task.dependencies?.length ? `<small class="blocked">waits on ${escapeHtml(task.dependencies.join(", "))}</small>` : "";
          return `<article class="task ${lane === "running" ? "selected" : ""}"><span class="id">${escapeHtml(task.id)}</span><strong>${escapeHtml(task.title)}</strong><span class="model">${escapeHtml(task.model)}${task.modelEvidence ? " · " + escapeHtml(task.modelEvidence) : ""}</span>${meta}${task.writer ? `<small>1 writer · ${escapeHtml(task.writer)}</small>` : ""}${task.worktree ? `<small>${escapeHtml(task.worktree)}</small>` : ""}${task.acceptance ? `<small>Acceptance: ${escapeHtml(task.acceptance)}</small>` : ""}${latest ? `<small class="verified">${escapeHtml(latest.summary)}</small>` : ""}</article>`;
        }).join("") || `<div class="empty">No tasks</div>`}</section>`;
      }).join("");
      root.innerHTML = `
        <section class="muster-shell">
          <header class="board-toolbar"><strong>${escapeHtml(value.name || "Muster work")}</strong><span class="muster-muted">Generated from the current prompt</span><span class="spacer"></span>${ready > 1 ? `<button class="muster-button" id="parallel">Run ${ready} ready in parallel</button>` : ""}</header>
          <div class="board-grid">${columns}</div>
          <footer class="board-footer">Cards move from observed events and acceptance checks—not agent self-report.</footer>
        </section>`;
      const parallel = document.getElementById("parallel");
      if (parallel) parallel.onclick = async () => {
        const prompt = `Start these independent Ready tasks in parallel with one writer and one worktree per task: ${byLane.ready.map((task) => `${task.id} ${task.title}`).join("; ")}. Keep the Muster board updated from observed evidence.`;
        if (window.openai?.sendFollowUpMessage) await window.openai.sendFollowUpMessage({ prompt });
        else await request("ui/message", { role: "user", content: [{ type: "text", text: prompt }] });
      };
    }

    function render(value) {
      if (!value) { root.innerHTML = `<div class="muster-shell"><div class="muster-muted" style="padding:18px">Waiting for Muster data…</div></div>`; return; }
      if (value.kind === "file") renderFile(value);
      else if (value.kind === "board") renderBoard(value);
      else root.innerHTML = `<div class="muster-shell error">Unsupported Muster view.</div>`;
    }

    window.addEventListener("message", (event) => {
      if (event.source !== window.parent) return;
      const message = event.data;
      if (!message || message.jsonrpc !== "2.0") return;
      if (message.id !== undefined && pending.has(message.id)) {
        const requestState = pending.get(message.id);
        pending.delete(message.id);
        if (message.error) requestState.reject(message.error); else requestState.resolve(message.result);
        return;
      }
      if (message.method === "ui/notifications/tool-result") {
        data = message.params?.structuredContent;
        render(data);
      }
    }, { passive: true });

    data = window.openai?.toolOutput?.structuredContent || window.openai?.toolOutput || null;
    render(data);
  })();
</script>
